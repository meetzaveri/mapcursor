        <!-- Pre-paint theme: apply the saved/system theme before the bundle
             loads so the boot loader + first paint match (no light flash).
             Keep this logic in sync with src/hooks/useTheme.ts. -->
        <script>
            ;(function () {
                try {
                    var stored = localStorage.getItem('mc-theme')
                    var pref =
                        stored === 'light' ||
                        stored === 'dark' ||
                        stored === 'system'
                            ? stored
                            : 'light'
                    var dark =
                        pref === 'dark' ||
                        (pref === 'system' &&
                            window.matchMedia('(prefers-color-scheme: dark)')
                                .matches)
                    if (dark) document.documentElement.classList.add('dark')
                } catch (e) {}
            })()
        </script>

        <!-- Inline startup loader (Variant A). Paints before the JS bundle
             loads; React replaces #root on first commit. Keep in sync with
             src/components/common/mapcursorLoader.css -->
        <style>
            #mc-boot {
                position: fixed;
                inset: 0;
                z-index: 9999;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 22px;
                /* Solid parchment only — the dot grid is canvas-only (behind
                   the dotGrid feature flag) and must never appear on the
                   loader. */
                background-color: #f5f0e8;
                /* One cycle for all three route animations; they must share a
                   duration or the cursor drifts off the head of its line. */
                --mc-cycle: 2.8s;
            }
            /* Dark boot loader — kept in sync with the .dark tokens in
               src/App.css so the loader matches the resolved theme. */
            .dark #mc-boot {
                background-color: #1c1814;
            }
            #mc-boot svg {
                width: 132px;
                height: 132px;
                overflow: visible;
            }
            /* Ink for the map and the cursor. Scoped to .mc-map / .mc-cursor
               on purpose: a blanket `svg path` rule would also recolour the
               mask's path, whose #FFFFFF is the only reason it reveals
               anything. */
            #mc-boot .mc-map path,
            #mc-boot .mc-cursor path {
                stroke: #1a1612;
            }
            .dark #mc-boot .mc-map path,
            .dark #mc-boot .mc-cursor path {
                stroke: #f3ece0;
            }
            #mc-boot .mc-wordmark {
                font-family: 'Fraunces', Georgia, serif;
                font-weight: 600;
                font-size: 22px;
                /* Pinned, not `normal`, which resolves off the font's own
                   metrics and moved the column when Fraunces loaded. */
                line-height: 1;
                letter-spacing: 0.5px;
                color: #1a1612;
            }
            .dark #mc-boot .mc-wordmark {
                color: #f3ece0;
            }
            #mc-boot .mc-caption {
                margin-top: -10px;
                font-family: 'Geist', system-ui, sans-serif;
                font-size: 13px;
                line-height: 1;
                letter-spacing: 0.3px;
                color: #8c7e6a;
            }
            #mc-boot .mc-caption::after {
                content: '';
                animation: mcBootDots 1.4s steps(4, end) infinite;
            }
            @keyframes mcBootDots {
                0% {
                    content: '';
                }
                25% {
                    content: '.';
                }
                50% {
                    content: '..';
                }
                75% {
                    content: '...';
                }
            }
            /* The route animation is CSS, not SMIL, and that is the whole
               point of it: SMIL's timeline does not start until the document
               `load` event, which this page blocks on the font stylesheet
               above and on the bundle below. The boot loader therefore used
               to paint its map and then sit frozen until everything had
               loaded, then snap into motion. CSS animations start at the
               element's first style resolution instead — the frame this
               paints. Keep in sync with src/components/common/
               mapcursorLoader.css, which carries the full note. */
            #mc-boot .mc-route {
                animation: mcBootRouteFade var(--mc-cycle) linear infinite;
            }
            #mc-boot .mc-route-wipe {
                stroke-dashoffset: 106.231;
                animation: mcBootRouteWipe var(--mc-cycle) linear infinite;
            }
            #mc-boot .mc-cursor {
                offset-path: path(
                    'M70,75 L105,75 Q115,75 115,85 L115,115 L140,115'
                );
                offset-rotate: 0deg;
                offset-distance: 0%;
                animation: mcBootCursorTravel var(--mc-cycle) linear infinite;
            }
            /* Pre-Safari-16: the line still draws, the cursor just rests. */
            @supports not (offset-path: path('M0 0')) {
                #mc-boot .mc-cursor {
                    transform: translate(70px, 75px);
                    animation: none;
                }
            }
            /* Frame 0 is the resting state — cursor parked at the start of the
               route, at full opacity — so the mark never appears without it.
               The rewind to that state happens between 92% and 95%, inside the
               fade-out, where nothing is visible; and 100% is identical to 0%,
               so the loop has no seam. */
            @keyframes mcBootRouteFade {
                0%,
                84% {
                    opacity: 1;
                }
                92%,
                95% {
                    opacity: 0;
                }
                100% {
                    opacity: 1;
                }
            }
            @keyframes mcBootCursorTravel {
                0%,
                6% {
                    offset-distance: 0%;
                }
                72%,
                92% {
                    offset-distance: 100%;
                }
                93%,
                100% {
                    offset-distance: 0%;
                }
            }
            @keyframes mcBootRouteWipe {
                0%,
                6% {
                    stroke-dashoffset: 106.231;
                }
                72%,
                92% {
                    stroke-dashoffset: 0;
                }
                93%,
                100% {
                    stroke-dashoffset: 106.231;
                }
            }
            /* Reduced motion gets the finished still frame. */
            @media (prefers-reduced-motion: reduce) {
                #mc-boot .mc-route,
                #mc-boot .mc-route-wipe,
                #mc-boot .mc-cursor {
                    animation: none;
                }
                #mc-boot .mc-route-wipe {
                    stroke-dashoffset: 0;
                }
                #mc-boot .mc-cursor {
                    offset-distance: 100%;
                }
                #mc-boot .mc-caption::after {
                    animation: none;
                    content: '...';
                }
            }
        </style>
